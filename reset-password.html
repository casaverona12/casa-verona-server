<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איפוס סיסמה | Casa Verona</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(10,10,10,.72), rgba(10,10,10,.82)),
        url("/assets/casa-verona-login-bg.png") center/cover no-repeat;
      color: #f4efe6;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 42px 34px;
      background: rgba(17,17,17,.94);
      border: 1px solid rgba(215,190,145,.28);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      text-align: center;
    }

    .logo {
      width: 110px;
      max-height: 80px;
      object-fit: contain;
      margin-bottom: 22px;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 500;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #bdb6aa;
      line-height: 1.6;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #d8d0c3;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid #37332d;
      background: #171717;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #cdb58a;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e7d6b7;
      color: #17130d;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff9b9b;
    }

    .success {
      color: #a8e6b0;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      src="/assets/casa-verona-logo.jpg"
      alt="Casa Verona"
      class="logo"
    >

    <h1>יצירת סיסמה חדשה</h1>

    <p class="subtitle">
      בחר סיסמה חדשה לחשבון Casa Verona שלך.
    </p>

    <form id="resetForm">
      <div class="field">
        <label for="password">סיסמה חדשה</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">אימות סיסמה</label>
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <button id="submitButton" type="submit">
        שמירת סיסמה חדשה
      </button>

      <div id="message"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "הסיסמה חייבת להכיל לפחות 8 תווים.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "הסיסמאות אינן תואמות.",
          "error"
        );
        return;
      }

      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      const accessToken = params.get("access_token");
      const type = params.get("type");

      if (!accessToken || type !== "recovery") {
        showMessage(
          "קישור האיפוס אינו תקין או שפג תוקפו. בקש קישור חדש.",
          "error"
        );
        return;
      }

      button.disabled = true;
      showMessage("מעדכן את הסיסמה...", "");

      try {
        const response = await fetch(
          "/api/auth/reset-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${accessToken}`
            },
            body: JSON.stringify({
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "לא ניתן לעדכן את הסיסמה"
          );
        }

        showMessage(
          "הסיסמה עודכנה בהצלחה. מעביר אותך להתחברות...",
          "success"
        );

        history.replaceState(
          null,
          "",
          window.location.pathname
        );

        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 1800);

      } catch (error) {
        showMessage(
          error.message || "אירעה שגיאה באיפוס הסיסמה.",
          "error"
        );
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
