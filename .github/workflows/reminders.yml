name: Casa Verona Reminders

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Run Casa Verona reminder engine
        run: |
          curl --fail-with-body \
            -X POST \
            "https://casa-verona-server.onrender.com/api/system/run-reminders" \
            -H "x-cron-secret: ${{ secrets.REMINDER_CRON_SECRET }}"
