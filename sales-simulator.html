<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Verona — AI Sales Simulator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
    }

    .gold { color: #d6b36a; }

    .subtitle {
      color: #888;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 20px;
    }

    .card {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    .card-title {
      padding: 18px 20px;
      border-bottom: 1px solid #292929;
      font-weight: bold;
    }

    .chat {
      height: 520px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 13px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .customer {
      align-self: flex-start;
      background: #292929;
    }

    .ai {
      align-self: flex-end;
      background: #d6b36a;
      color: #111;
    }

    .input-area {
      border-top: 1px solid #292929;
      padding: 15px;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 55px;
      max-height: 120px;
      resize: vertical;
      background: #0c0c0c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 13px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #d6b36a;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 22px;
      background: #d6b36a;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .brain {
      padding: 20px;
    }

    .temperature {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .brain-row {
      border-bottom: 1px solid #292929;
      padding: 12px 0;
    }

    .brain-row:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 5px;
    }

    .value {
      line-height: 1.4;
    }

    .score {
      color: #d6b36a;
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #999;
      padding: 10px;
      font-size: 13px;
    }

    .reset {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
    }

    @media(max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .chat {
        height: 430px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">
      CASA <span class="gold">VERONA</span>
    </div>

    <div class="subtitle">
      AI Sales Simulator — Brain + Sales Agent
    </div>
  </div>

  <div class="grid">

    <!-- CHAT -->
    <div class="card">

      <div class="card-title">
        💬 סימולציית WhatsApp
      </div>

      <div id="chat" class="chat">

        <div class="message ai">
          היי 👋 ברוכים הבאים ל-Casa Verona.
          איך אפשר לעזור לכם היום?
        </div>

      </div>

      <div id="status" class="status">
        מוכן לשיחה
      </div>

      <div class="input-area">

        <textarea
          id="message"
          placeholder="תכתוב כאן כאילו אתה הלקוח..."
        ></textarea>

        <button
          id="sendButton"
          onclick="sendMessage()"
        >
          שלח
        </button>

      </div>

    </div>

    <!-- BRAIN -->
    <div class="card">

      <div class="card-title">
        🧠 Casa Verona Brain
      </div>

      <div class="brain">

        <div
          id="temperature"
          class="temperature"
        >
          ⚪ ממתין לליד
        </div>

        <div class="brain-row">
          <div class="label">
            ציון כוונת רכישה
          </div>
          <div
            id="score"
            class="score"
          >
            0/100
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            כוונה
          </div>
          <div
            id="intent"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            מוצר
          </div>
          <div
            id="product"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            תקציב
          </div>
          <div
            id="budget"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            התנגדות
          </div>
          <div
            id="objection"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            🎯 הפעולה הבאה
          </div>
          <div
            id="nextAction"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            העברה לאיש מכירות
          </div>
          <div
            id="human"
            class="value"
          >
            —
          </div>
        </div>

        <div class="brain-row">
          <div class="label">
            סיכום הליד
          </div>
          <div
            id="summary"
            class="value"
          >
            —
          </div>
        </div>

        <button
          class="reset"
          onclick="resetChat()"
        >
          🔄 התחל שיחה חדשה
        </button>

      </div>

    </div>

  </div>

</div>

<script>

const BASE_URL =
  "https://casa-verona-server.onrender.com";

let conversation = [];

async function sendMessage() {

  const input =
    document.getElementById("message");

  const button =
    document.getElementById("sendButton");

  const status =
    document.getElementById("status");

  const message =
    input.value.trim();

  if (!message) return;

  addMessage(
    message,
    "customer"
  );

  conversation.push({
    role: "customer",
    message
  });

  input.value = "";
  button.disabled = true;

  status.textContent =
    "🧠 המוח מנתח את הלקוח...";

  try {

    // 1. BRAIN ANALYSIS

    const brainResponse =
      await fetch(
        BASE_URL + "/brain",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message
          })
        }
      );

    const brainData =
      await brainResponse.json();

    if (
      !brainResponse.ok ||
      !brainData.success
    ) {
      throw new Error(
        brainData.error ||
        "Brain failed"
      );
    }

    updateBrain(
      brainData.analysis
    );

    status.textContent =
      "🤖 איש המכירות AI מכין תשובה...";

    // 2. SALES AI

    const aiResponse =
      await fetch(
        BASE_URL + "/ai",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message,
            leads: [
              {
                analysis:
                  brainData.analysis,
                conversation
              }
            ]
          })
        }
      );

    const aiData =
      await aiResponse.json();

    if (
      !aiResponse.ok ||
      !aiData.success
    ) {
      throw new Error(
        aiData.error ||
        "Sales AI failed"
      );
    }

    addMessage(
      aiData.answer,
      "ai"
    );

    conversation.push({
      role: "assistant",
      message: aiData.answer
    });

    status.textContent =
      "✅ מוכן להודעה הבאה";

  } catch (error) {

    console.error(error);

    addMessage(
      "❌ שגיאה בחיבור למנוע ה-AI",
      "ai"
    );

    status.textContent =
      "אירעה שגיאה";

  } finally {

    button.disabled = false;
    input.focus();
  }
}

function addMessage(
  text,
  type
) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}

function updateBrain(a) {

  document.getElementById(
    "temperature"
  ).textContent =
    temperatureText(
      a.temperature
    );

  document.getElementById(
    "score"
  ).textContent =
    `${a.buying_signal ?? 0}/100`;

  document.getElementById(
    "intent"
  ).textContent =
    a.intent || "—";

  document.getElementById(
    "product"
  ).textContent =
    a.product || "—";

  document.getElementById(
    "budget"
  ).textContent =
    a.budget !== null &&
    a.budget !== undefined
      ? `₪${Number(
          a.budget
        ).toLocaleString()}`
      : "לא צוין";

  document.getElementById(
    "objection"
  ).textContent =
    a.objection ||
    "אין התנגדות";

  document.getElementById(
    "nextAction"
  ).textContent =
    a.next_action || "—";

  document.getElementById(
    "human"
  ).textContent =
    a.needs_human
      ? "🔥 כן — להעביר לאדם"
      : "🤖 לא — AI ממשיך";

  document.getElementById(
    "summary"
  ).textContent =
    a.summary || "—";
}

function temperatureText(t) {

  switch (
    String(t || "")
      .toUpperCase()
  ) {

    case "HOT":
      return "🔥 HOT — ליד חם";

    case "WARM":
      return "🟠 WARM — ליד מתחמם";

    case "COLD":
      return "❄️ COLD — ליד קר";

    default:
      return "⚪ לא ידוע";
  }
}

function resetChat() {

  conversation = [];

  document.getElementById(
    "chat"
  ).innerHTML = `
    <div class="message ai">
      היי 👋 ברוכים הבאים ל-Casa Verona.
      איך אפשר לעזור לכם היום?
    </div>
  `;

  document.getElementById(
    "temperature"
  ).textContent =
    "⚪ ממתין לליד";

  document.getElementById(
    "score"
  ).textContent =
    "0/100";

  [
    "intent",
    "product",
    "budget",
    "objection",
    "nextAction",
    "human",
    "summary"
  ].forEach(id => {

    document.getElementById(
      id
    ).textContent = "—";

  });

  document.getElementById(
    "status"
  ).textContent =
    "מוכן לשיחה";
}

// ENTER = SEND
document
  .getElementById("message")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    }
  );

</script>

</body>
</html>
